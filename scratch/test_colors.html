<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #fff; padding: 30px; display: flex; flex-wrap: wrap; gap: 16px; }
  .box { background: linear-gradient(180deg, #580d16 0%, #38060c 100%); padding: 16px 20px; width: 280px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
  strong { font-size: 22px; font-weight: 800; color: #fff; display: block; margin-bottom: 4px; }
  .label { font-size: 11px; color: #94a3b8; }
  .c-current span { color: #f0a2a8; }
  .c-vivid-crimson span { color: #e02438; }
  .c-red600 span { color: #dc2626; }
  .c-rose600 span { color: #e11d48; }
  .c-theme-crimson span { color: #c93b4a; }
  .c-deep-crimson span { color: #b91c1c; }
  .c-primary span { color: #8c1724; }
  .c-ruby span { color: #991b1b; }
</style>
</head>
<body>
  <div class="box c-current"><strong>Edu<span>Care</span></strong><div class="label">Current (#f0a2a8) - Pale pink</div></div>
  <div class="box c-vivid-crimson"><strong>Edu<span>Care</span></strong><div class="label">#e02438 - Vivid Crimson</div></div>
  <div class="box c-red600"><strong>Edu<span>Care</span></strong><div class="label">#dc2626 - Red 600 (Darker Red)</div></div>
  <div class="box c-rose600"><strong>Edu<span>Care</span></strong><div class="label">#e11d48 - Rose 600 (Dark Ruby)</div></div>
  <div class="box c-theme-crimson"><strong>Edu<span>Care</span></strong><div class="label">#c93b4a - Theme Crimson</div></div>
  <div class="box c-deep-crimson"><strong>Edu<span>Care</span></strong><div class="label">#b91c1c - Deep Red 700</div></div>
  <div class="box c-primary"><strong>Edu<span>Care</span></strong><div class="label">#8c1724 - Primary (#8c1724)</div></div>
</body>
</html>
