name: Build EduCare APK

# Builds the Android WebView wrapper and publishes the debug APK.
#   - Push to master : build + upload artifact (when android/ or this workflow changes)
#   - Manual run     : Actions -> Build EduCare APK -> Run workflow (artifact + "apk-latest" release)
#   - Tag push       : git tag v1.0.0 && git push origin v1.0.0 (attached to that GitHub Release)
# The server URL comes from the EDUCARE_URL repository variable, or the
# educare_url input when the workflow is started manually.

on:
  workflow_dispatch:
    inputs:
      educare_url:
        description: 'EduCare server URL (blank = use the EDUCARE_URL repo variable)'
        required: false
        type: string
  push:
    branches:
      - master
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: educare-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  EDUCARE_URL: ${{ inputs.educare_url || vars.EDUCARE_URL || 'https://busy-artwork-england-hands.trycloudflare.com' }}

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME +
      # cmdline-tools on PATH), so install the exact platform/build tools
      # directly. android-actions/setup-android@v3 fails on the current
      # runner image because it tries to install the removed 'tools' package.
      - name: Install SDK platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="1.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          ./android/gradlew -p android assembleDebug --no-daemon --console=plain \
            -PeduCareUrl="$EDUCARE_URL" \
            -PeduCareVersionName="${{ steps.version.outputs.name }}" \
            -PeduCareVersionCode="${{ github.run_number }}"

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/educare-${{ steps.version.outputs.name }}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: educare-apk-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      # Manual runs keep a rolling "apk-latest" prerelease so there is always
      # a stable download link without creating a version tag.
      - name: Publish rolling release (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: EduCare APK (latest build)
          prerelease: true
          generate_release_notes: false
          fail_on_unmatched_files: true
          body: |
            Debug APK built from `${{ github.sha }}`.

            - Server URL: `${{ env.EDUCARE_URL }}`
            - Version: `${{ steps.version.outputs.name }}` (`${{ github.run_number }}`)
            - Workflow run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            Install it by opening the `.apk` on an Android phone (allow "install unknown apps").
          files: artifacts/*.apk

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: EduCare ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Job summary
        if: always()
        run: |
          {
            echo "### EduCare APK"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Server URL | \`$EDUCARE_URL\` |"
            echo "| Version | \`${{ steps.version.outputs.name }}\` (code ${{ github.run_number }}) |"
            echo "| Artifact | \`educare-apk-${{ github.run_number }}-${{ github.run_attempt }}\` |"
            echo "| Trigger | \`${{ github.event_name }}\` on \`${{ github.ref_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
